<body>
<main>
  <section id="start" class="screen">
    <img class="logo" src="logo.svg" alt="C.H. Formació">
    <h1>Speaking C1 <span>Advanced</span></h1>
    <p class="sub">Choose what you want to practise</p>
    <div class="choices">
      <button id="btnP1" class="big p1"><span class="n">Part 1</span><span class="d">One question<br>with feedback</span></button>
      <button id="btnP4" class="big p4"><span class="n">Part 4</span><span class="d">Discussion<br>3 questions on one topic</span></button>
      <button id="btnFull" class="big full"><span class="n">Full Session <small>(1+4)</small></span><span class="d">Part 1, then<br>3 Part 4 questions</span></button>
    </div>
    <p class="tip">🎧 Use headphones if you can · keep the screen on</p>
  </section>

  <section id="countdown" class="screen" hidden>
    <p class="cdHint" id="cdHint"></p>
    <div class="cdNum" id="cdNum">5</div>
    <p class="sub">Get ready… the coach will ask you a question.</p>
    <button id="cdStop" class="ghost">Cancel</button>
  </section>

  <section id="session" class="screen" hidden>
    <header class="bar">
      <img class="logo small" src="logo.svg" alt="C.H. Formació">
      <span id="partBadge" class="pill">Part 1</span>
      <button id="stopBtn" class="ghost">Stop</button>
    </header>
    <div class="stage">
      <div id="orb" class="orb listening"></div>
      <p id="status" class="status">Connecting…</p>
      <div id="timer" class="timer idle hidden">
        <div class="tNum" id="timerNum">30</div>
        <div class="tTrack"><div id="timerBar" class="tBar"></div></div>
        <div class="tLabel" id="timerLabel"></div>
      </div>
      <button id="helpBtn" class="help" hidden>🤔 I don't understand</button>
      <div id="qCard" class="card q" hidden>
        <div class="cardHead"><span id="qPart">Part 1</span><button id="qClose" class="x" aria-label="Close">✕</button></div>
        <p id="qText"></p>
      </div>
      <div id="result" class="card result" hidden>
        <div id="resBadge" class="badge pass">Pass</div>
        <div id="resLines"></div>
        <p id="resNote" class="note"></p>
        <div id="feedbackWrap" hidden>
          <div class="fbHead">What the coach said</div>
          <p id="feedback" class="fb"></p>
        </div>
      </div>
    </div>
  </section>

  <section id="ended" class="screen" hidden>
    <img class="logo" src="logo.svg" alt="C.H. Formació">
    <p id="endMsg" class="sub">The session has ended.</p>
    <p id="endDetail" class="tip"></p>
    <button id="againBtn" class="big p1 one"><span class="n">Back to start</span></button>
  </section>
</main>
<script src="app.js?v=3"></script>
</body>
</html>
